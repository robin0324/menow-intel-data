<head>

<style>
:root{
  --brand:#1565C0; --brand-dark:#0D47A1; --brand-light:#E3F2FD;
  --card-bg:#fff; --bg:#F4F6F9; --text:#1f2d3d; --text2:#5a6b7b;
  --border:#e6ebf1; --radius:16px; --radius-sm:10px;
  --shadow:0 4px 18px rgba(20,50,90,.07); --shadow-hover:0 8px 28px rgba(20,50,90,.12);
  --pos:#2E7D32; --neu:#607D8B; --ln:#EF6C00; --hr:#C62828; --senti:#7B1FA2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--brand);text-decoration:none}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 24px;background:linear-gradient(135deg,#7B1FA2,#9C27B0);color:#fff;box-shadow:0 2px 12px rgba(123,31,162,.3)}
.topbar .tb-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar .tb-title span{opacity:.85;font-weight:400}
.topbar .back{margin-left:auto;padding:7px 16px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:13px}
.topbar .back:hover{background:rgba(255,255,255,.3);color:#fff}
.cover-note{margin:14px 24px 0;padding:10px 16px;border-radius:10px;background:#F3E5F5;color:#6A1B9A;font-size:13px;border:1px solid #E1BEE7}
/* 日期选择器 */
.date-bar{margin:14px 24px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow)}
.date-bar .db-label{font-size:13px;font-weight:600;color:var(--senti)}
.date-bar .db-date{font-size:15px;font-weight:800;color:var(--text)}
.date-bar .db-hint{font-size:12px;color:var(--text2)}
.date-bar button{border:1px solid var(--senti);background:#fff;color:var(--senti);border-radius:14px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer}
.date-bar button:hover{background:var(--senti);color:#fff}
.date-bar button.primary{background:var(--senti);color:#fff}
.date-bar .db-dates{display:flex;gap:6px;flex-wrap:wrap}
.date-bar .db-dates span{cursor:pointer;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--border);color:var(--text2)}
.date-bar .db-dates span.cur{background:var(--senti);color:#fff;border-color:var(--senti);font-weight:600}
.date-bar .db-dates span:hover{border-color:var(--senti);color:var(--senti)}
.cal-popup{position:absolute;z-index:80;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-hover);padding:14px;width:300px;display:none}
.cal-popup.show{display:block}
.cal-popup .cp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-popup .cp-title{font-size:14px;font-weight:700;color:var(--text)}
.cal-popup .cp-nav button{border:1px solid var(--border);background:#fff;border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--text2)}
.cal-popup .cp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text2);margin-bottom:4px}
.cal-popup .cp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-popup .cp-day{height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:8px;cursor:pointer;color:var(--text)}
.cal-popup .cp-day:hover{background:var(--brand-light)}
.cal-popup .cp-day.cp-other{color:#c5cdd6}
.cal-popup .cp-day.cp-today{font-weight:800;color:var(--brand)}
.cal-popup .cp-day.cp-has{background:#F3E5F5;color:var(--senti);font-weight:700}
.cal-popup .cp-day.cp-cur{background:var(--senti);color:#fff}
.cal-popup .cp-foot{margin-top:8px;font-size:11px;color:var(--text2);text-align:center}
.wrap{max-width:1180px;margin:0 auto;padding:18px 24px 60px}
.module{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden;border:1px solid var(--border)}
.mod-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 12px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--brand-light) 0%,#fff 100%)}
.mod-header h2{font-size:17px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:8px}
.mod-header h2 .icon{font-size:20px}
.mod-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:var(--senti);color:#fff;white-space:nowrap}
.mod-note{margin:0 22px 14px;padding:8px 12px;border-radius:8px;background:#F8F9FB;border:1px dashed var(--border);color:var(--text2);font-size:12px;line-height:1.7}
.mod-note b{color:var(--brand)}
.mod-body{padding:18px 22px 22px}
/* 总览卡 */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ov-card{padding:14px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s}
.ov-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.ov-card .num{font-size:28px;font-weight:800;line-height:1.1}
.ov-card .lab{font-size:12px;color:var(--text2);margin-top:4px}
.ov-card .hint{font-size:10px;color:#90A4AE;margin-top:3px}
.ov-card.risk{background:#FFEBEE}.ov-card.risk .num{color:var(--hr)}
.ov-card.pos{background:#E8F5E9}.ov-card.pos .num{color:var(--pos)}
.ov-card.neu{background:#ECEFF1}.ov-card.neu .num{color:var(--neu)}
.ov-card.ln{background:#FFF3E0}.ov-card.ln .num{color:var(--ln)}
.ov-card.filt{background:#E3F2FD}.ov-card.filt .num{color:var(--brand);cursor:default}
/* 图表区 */
.charts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px}
@media(max-width:860px){.charts{grid-template-columns:1fr}}
.chart-box{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.chart-box h4{font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600}
.donut{width:130px;height:130px;border-radius:50%;margin:6px auto;position:relative}
.donut::after{content:'';position:absolute;inset:32px;background:#fff;border-radius:50%}
.donut-legend{font-size:12px;margin-top:8px}
.donut-legend span{display:inline-flex;align-items:center;gap:4px;margin-right:10px}
.donut-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.pbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.pbar .pname{width:64px;color:var(--text2);flex-shrink:0}
.pbar .ptrack{flex:1;height:14px;background:#eef1f5;border-radius:7px;overflow:hidden;position:relative}
.pbar .pfill{height:100%;border-radius:7px;transition:width .4s}
.pbar .pcnt{width:34px;text-align:right;color:var(--text2);flex-shrink:0;font-weight:700}
/* 风险清单 */
.risk-item{border:1px solid var(--border);border-left:5px solid var(--hr);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.risk-item.light{border-left-color:var(--ln)}
.risk-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;color:#fff}
.tag.high_risk{background:var(--hr)}.tag.light_negative{background:var(--ln)}
.tag.src{background:#607D8B}.tag.heat{background:#455A64}.tag.brand{background:#1565C0}
.risk-text{font-size:14px;margin:4px 0}
.risk-link{margin-top:6px}
.risk-link a{font-size:12px;font-weight:600;color:var(--brand);border:1px solid var(--brand);border-radius:12px;padding:2px 10px;display:inline-block}
.risk-link a:hover{background:var(--brand);color:#fff}
.risk-disposal{font-size:13px;color:var(--text2);background:#F8F9FB;border-radius:8px;padding:8px 10px;margin-top:6px}
.risk-disposal b{color:var(--brand)}
.empty{color:var(--text2);font-size:13px;padding:10px 0;text-align:center}
/* 分平台 tab */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:6px 16px;border-radius:16px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--border);color:var(--text2);cursor:pointer}
.tab.active{background:var(--senti);color:#fff;border-color:var(--senti)}
.ptab-block{display:none}.ptab-block.active{display:block}
.ptab-block h5{font-size:13px;margin:10px 0 4px;color:var(--brand)}
.ptab-block ul{margin:0;padding-left:18px;font-size:13px;color:var(--text2)}
/* 竞品卡 */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.comp-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.comp-card h3{font-size:15px;color:var(--senti);margin-bottom:8px}
.comp-card .blk{font-size:12px;margin:6px 0}
.comp-card .blk b{color:var(--brand)}
.comp-card ul{margin:2px 0 0;padding-left:16px;font-size:12px;color:var(--text2)}
.comp-card .risk-box{background:#FFF3E0;border:1px solid #FFCC80;border-radius:8px;padding:8px;margin-top:8px}
.comp-card .risk-box b{color:#E65100}
/* 列表 */
.list-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px}
.list-row:last-child{border-bottom:none}
.list-row .lv{font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;color:#fff;white-space:nowrap;flex-shrink:0}
.list-row .meta{color:var(--text2);font-size:12px}
.list-row a{color:var(--brand);font-size:12px;white-space:nowrap}
.dw-wrap{display:flex;flex-wrap:wrap;gap:8px}
.dw{font-size:13px;font-weight:600;padding:5px 12px;border-radius:14px;display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.dw .dw-word{line-height:1.2}
.dw .dw-pf{font-size:10px;font-weight:400;color:#fff;background:rgba(0,0,0,.22);border-radius:8px;padding:1px 7px}
.dw.neg{background:#FFEBEE;color:var(--hr);border:1px solid #FFCDD2}
.dw.ok{background:#E8F5E9;color:var(--pos);border:1px solid #C8E6C9}
.sugg li{margin:6px 0 6px 18px;font-size:14px}
.foot{text-align:center;color:var(--text2);font-size:12px;padding:20px;line-height:1.8}
/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(20,40,70,.45);opacity:0;visibility:hidden;transition:.25s;z-index:90}
.mask.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(20,50,90,.25);transform:translateX(105%);transition:transform .28s;z-index:100;display:flex;flex-direction:column}
.drawer.show{transform:none}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-head .d-title{font-size:16px;font-weight:700;flex:1}
.drawer-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:15px;color:var(--text2)}
.drawer-body{flex:1;overflow-y:auto;padding:14px 20px 30px}
.drawer-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.drawer-item .d-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px}
.drawer-item .d-text{color:var(--text)}
.drawer-item a{font-size:12px;font-weight:600}
</style>
</head>

function curDateFromUrl(){
  const m=location.search.match(/[?&]date=(\d{4}-\d{2}-\d{2})/);
  if(m && AVAIL.indexOf(m[1])>=0) return m[1];
  if(m && m[1]) return m[1];               // 允许查看无数据日期（显示空态引导）

function addDays(ds,n){
  const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n);
  const mm=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+mm+'-'+dd;
}

  const now=CUR_DATE?new Date(CUR_DATE+'T00:00:00'):new Date();
  cpY=now.getFullYear(); cpM=now.getMonth();
  renderCal(); p.classList.add('show');

document.addEventListener('click',function(e){
  const b=document.querySelector('.date-bar');
  if(b && !b.contains(e.target)) document.getElementById('calPopup').classList.remove('show');
});
function renderCal(){
  document.getElementById('cpTitle').textContent=cpY+'年'+(cpM+1)+'月';
  const grid=document.getElementById('cpGrid'); grid.innerHTML='';
  const first=new Date(cpY,cpM,1).getDay();
  const offset=first===0?6:first-1;
  const dim=new Date(cpY,cpM+1,0).getDate();
  const dip=new Date(cpY,cpM,0).getDate();
  for(let i=offset-1;i>=0;i--){
    const c=document.createElement('div'); c.className='cp-day cp-other'; c.textContent=dip-i; grid.appendChild(c);
  }
  const avSet=new Set(AVAIL);
  for(let d=1;d<=dim;d++){
    const c=document.createElement('div'); c.className='cp-day';
    const ds=cpY+'-'+String(cpM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    c.textContent=d;
    if(avSet.has(ds)) c.classList.add('cp-has');
    if(ds===CUR_DATE) c.classList.add('cp-cur');
    c.onclick=function(){ document.getElementById('calPopup').classList.remove('show'); setDate(ds); };
    grid.appendChild(c);
  }
  const total=Math.ceil((offset+dim)/7)*7;
  for(let i=0;i<total-offset-dim;i++){
    const c=document.createElement('div'); c.className='cp-day cp-other'; c.textContent=i+1; grid.appendChild(c);
  }
}
function cpMonth(dir){ cpM+=dir; if(cpM>11){cpM=0;cpY++;} if(cpM<0){cpM=11;cpY--;} renderCal(); }

    ' ｜ <b>生成：</b>'+(META.generated_at||'—')+
    '<br><b>声量口径：</b>'+(META.voice_scope||'')+
    '<br><b>检索策略：</b>'+(META.strategy||'')+
    '<br><b>覆盖说明：</b>'+(META.coverage_note||'');

  const app=document.getElementById('app');
  app.innerHTML='';

  // 空态引导（该日期无舆情数据）
  if(!hasAny){
    const emptyHtml='<section class="module"><div class="mod-header"><h2><span class="icon">🗓️</span> '+ev+' 舆情</h2></div><div class="mod-body">'+
      '<div class="empty">📭 <b>'+ev+'</b> 当日无舆情数据<br><span style="font-size:12px">舆情监测自 2026-08-17 启动，该日期暂无采集记录；请通过上方日期栏切换其他日期，或等待每日 9:00 自动化累积。</span></div></div></section>';
    app.appendChild(el(emptyHtml));
    // 快照类仍展示最新口径
    app.appendChild(el(buildCharts(D)));
    app.appendChild(el(buildCompetitors(D.competitors||[])));
    app.appendChild(el(buildDropdown(words)));
    return;
  }

  // ① 总览
  const drawerPool={high_risk:[],light_negative:[],neutral:[],positive:[]};
  risks.forEach(r=>{ if(drawerPool[r.level]) drawerPool[r.level].push({type:'risk',text:r.text,source:r.source,account:r.account,date:r.date,url:r.source_url,disposal:r.disposal}); });
  topics.forEach(t=>{ const lv=t.sentiment_level||'neutral'; if(drawerPool[lv]) drawerPool[lv].push({type:'topic',text:t.topic||t.title||t.text,platform:t.platform,source:t.source||t.platform,volume:t.volume,date:t.time,url:t.source_url,direction:t.trend_direction||t.summary||''}); });
  words.forEach(w=>{ if(w.negative) drawerPool.light_negative.push({type:'word',text:'搜索联想词：'+w.word,platform:(w.platform||[]).join('/'),url:w.source_url}); });
  window.__pool=drawerPool;
  const cntLv=(lv)=>drawerPool[lv].length;
  const ovCards=[
    {lv:'high_risk',cls:'risk',label:'高危紧急负面'},
    {lv:'light_negative',cls:'ln',label:'轻度负面'},
    {lv:'neutral',cls:'neu',label:'中性'},
    {lv:'positive',cls:'pos',label:'正面'},
  ].map(c=>`<div class="ov-card ${c.cls}" onclick="openDrawer('${c.lv}')" title="点击查看明细"><div class="num">${cntLv(c.lv)}</div><div class="lab">${c.label}</div><div class="hint">点击查看明细 ▸</div></div>`).join('');
  const ovHtml=`<section class="module"><div class="mod-header"><h2><span class="icon">📊</span> 舆情总览（${ev} 新增）</h2><span class="mod-badge">整体风险：待评估</span></div>
   <div class="mod-body">${modNote('统计依据：仅统计 <b>'+ev+'</b> 当日发生的舆情条目，按情绪分级统计（高危/轻度负面取自风险清单+热点话题，中性/正面取自热点话题；点击数字查看对应条目明细）。')}
   <div class="ov-grid">${ovCards}</div></div></section>`;
  app.appendChild(el(ovHtml));

  // ② 声量趋势与分布
  app.appendChild(el(buildCharts(D)));

  // ③ 风险清单（仅美诺）
  app.appendChild(el(buildRisks(risks.filter(r=>(r.brand||'美诺')==='美诺'), ev)));

  // ④ 分平台口碑（仅美诺，快照为最新口径）
  app.appendChild(el(buildPlatforms(D.platform_summary||{})));

  // ⑤ 竞品口碑动态
  app.appendChild(el(buildCompetitors(D.competitors||[])));

  // ⑥ 热点话题
  app.appendChild(el(buildList('🔥 社媒热点话题声量','hot_topics',topics,'topic','volume')));

  // ⑦ 代言人舆情
  app.appendChild(el(buildEndorse(D.endorsement||[])));

  // ⑧ 下拉词
  app.appendChild(el(buildDropdown(words)));

  // ⑨ 防控建议
  const sugg=(D.suggestions||[]);
  const suggHtml=`<section class="module"><div class="mod-header"><h2><span class="icon">✅</span> 下一周期防控建议</h2><span class="mod-badge">快照为最新口径</span></div>
    <div class="mod-body">${sugg.length?('<ul class="sugg">'+sugg.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>'):'<div class="empty">暂无建议</div>'}</div></section>`;
  app.appendChild(el(suggHtml));

  bindTabs();
}

function buildCharts(D){
  const trend=D.trend||[];
  const dist=D.sentiment_dist||{};
  let trendSvg='<div class="empty">近 7 日采样不足</div>';
  if(trend.length>=2){
    const W=560,H=120,pad=20;const max=Math.max(...trend.map(t=>t.count),1);
    const pts=trend.map((t,i)=>{const x=pad+i*(W-2*pad)/(trend.length-1);const y=H-pad-(t.count/max)*(H-2*pad);return x.toFixed(1)+','+y.toFixed(1);});
    trendSvg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="120"><polyline fill="none" stroke="#7B1FA2" stroke-width="2.5" points="${pts.join(' ')}"/>`+
      trend.map((t,i)=>{const x=pad+i*(W-2*pad)/(trend.length-1);const y=H-pad-(t.count/max)*(H-2*pad);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#7B1FA2"/><text x="${x.toFixed(1)}" y="${H-4}" font-size="9" fill="#607D8B" text-anchor="middle">${esc(t.date)}</text><text x="${x.toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="9" fill="#7B1FA2" text-anchor="middle">${t.count}</text>`;}).join('')+
      `</svg>`;
  }
  const tot=Object.values(dist).reduce((a,b)=>a+(b||0),0)||1;
  let acc=0;const segs=[];
  [['high_risk','#C62828'],['light_negative','#EF6C00'],['neutral','#607D8B'],['positive','#2E7D32']].forEach(([k,c])=>{
    const v=dist[k]||0;const start=acc/tot*360;acc+=v;const end=acc/tot*360;
    segs.push(`${c} ${start.toFixed(1)}deg ${end.toFixed(1)}deg`);
  });
  const donut=`<div class="donut" style="background:conic-gradient(${segs.join(',')})"></div>`;
  const legend=`<div class="donut-legend">`+[['high_risk','高危'],['light_negative','轻负'],['neutral','中性'],['positive','正面']].map(([k,t])=>`<span><i style="background:${LEVEL_COLOR[k]}"></i>${t} ${dist[k]||0}</span>`).join('')+`</div>`;
  return `<section class="module"><div class="mod-header"><h2><span class="icon">📈</span> 声量趋势与分布</h2><span class="mod-badge">仅美诺品牌 · 快照最新口径</span></div>
   <div class="mod-body">${modNote('统计口径：'+esc((D.meta||{}).voice_scope||'仅美诺品牌公开检索条目数')+'；条形按各平台数量占最大平台比例填充（颜色越满=数量越高），数据为公开检索相对估算；趋势/分布为最新监测日快照。')}
   <div class="charts">
     <div class="chart-box"><h4>近 7 日声量趋势</h4>${trendSvg}</div>
     <div class="chart-box"><h4>情感分布</h4>${donut}${legend}</div>
     <div class="chart-box"><h4>平台分布</h4><div class="pbar"><span class="pname">电商评价</span><span class="ptrack"><span class="pfill" style="width:100%;background:#FB8C00"></span></span><span class="pcnt">55</span></div><div class="pbar"><span class="pname">小红书</span><span class="ptrack"><span class="pfill" style="width:58%;background:#E0245E"></span></span><span class="pcnt">32</span></div><div class="pbar"><span class="pname">抖音</span><span class="ptrack"><span class="pfill" style="width:44%;background:#111"></span></span><span class="pcnt">24</span></div><div class="pbar"><span class="pname">微博</span><span class="ptrack"><span class="pfill" style="width:24%;background:#E6162D"></span></span><span class="pcnt">13</span></div><div class="pbar"><span class="pname">快手</span><span class="ptrack"><span class="pfill" style="width:9%;background:#FF4906"></span></span><span class="pcnt">5</span></div></div>
   </div></div></section>`;
}

function buildRisks(risks, ev){
  const sorted=[...risks].sort((a,b)=>((a.level==='high_risk')?-1:1)-((b.level==='high_risk')?-1:1));
  const items=sorted.map(r=>{
    const lvl=r.level||'light_negative';
    const cls=lvl==='high_risk'?'risk-item':'risk-item light';
    return `<div class="${cls}">
      <div class="risk-meta">
        <span class="tag ${lvl}">${LEVEL_LABEL[lvl]||lvl}</span>
        ${r.source?`<span class="tag src">${esc(r.source)}</span>`:''}
        ${r.account?`<span class="meta">@${esc(r.account)}</span>`:''}
        ${r.date?`<span class="meta">${esc(r.date)}</span>`:''}
        ${r.heat?`<span class="tag heat">热度 ${esc(r.heat)}</span>`:''}
      </div>
      <div class="risk-text">${esc(r.text)}</div>
      ${sourceLink(r)}
      ${r.disposal?`<div class="risk-disposal"><b>处置方案：</b>${esc(r.disposal)}</div>`:''}
    </div>`;
  }).join('')||'<div class="empty">'+ev+' 未检出美诺风险舆情 🎉</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">⚠️</span> 风险舆情清单</h2><span class="mod-badge">仅美诺 · 高危置顶</span></div>
   <div class="mod-body">${modNote('范围：仅展示 <b>'+ev+'</b> 发生的、美诺 MENOW 品牌相关风险（竞品风险见「竞品口碑动态」）；每条提供来源链接，点击可直达详情页处理。')}
   ${items}</div></section>`;
}

function buildPlatforms(ps){
  const plats=Object.keys(ps);
  if(!plats.length) return `<section class="module"><div class="mod-header"><h2><span class="icon">🗣️</span> 分平台口碑汇总</h2></div><div class="mod-body"><div class="empty">暂无分平台数据</div></div></section>`;
  const tabs=plats.map((p,i)=>`<div class="tab ${i===0?'active':''}" data-p="${esc(p)}">${esc(p)}</div>`).join('');
  const blocks=plats.map((p,i)=>{
    const d=ps[p]||{};
    const ul=(arr,empty)=>((arr&&arr.length)?'<ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="empty">'+empty+'</div>');
    return `<div class="ptab-block ${i===0?'active':''}" data-p="${esc(p)}">
      <h5>👍 核心夸赞卖点</h5>${ul(d.praise,'暂无')}
      <h5>💬 高频用户咨询</h5>${ul(d.consult,'暂无')}
      <h5>🟠 轻度负面</h5>${ul(d.light_negative,'暂无')}
    </div>`;
  }).join('');
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🗣️</span> 分平台口碑汇总</h2><span class="mod-badge">仅美诺品牌 · 快照最新口径</span></div>
   <div class="mod-body">${modNote('范围：仅美诺 MENOW 品牌各平台口碑概览（竞品口碑见「竞品口碑动态」）；内容为公开检索归纳，原生评论区深度内容可能缺失；快照为最新监测日口径。')}
   <div class="tabs">${tabs}</div>${blocks}</div></section>`;
}

function buildCompetitors(comps){
  const cards=comps.map(c=>{
    const hr=(c.high_risk&&c.high_risk.length)?('<div class="risk-box"><b>⚠️ 竞品风险（供对标）：</b><ul>'+
      c.high_risk.map(r=>'<li>'+esc(r.text)+' '+(r.source_url?'<a href="'+esc(r.source_url)+'" target="_blank">查看来源</a>':'')+'</li>').join('')+'</ul></div>'):'';
    return `<div class="comp-card"><h3>${esc(c.name)}</h3>
    <div class="blk"><b>👍 优点</b><ul>${(c.pros||[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>暂无</li>'}</ul></div>
    <div class="blk"><b>🟠 用户痛点</b><ul>${(c.pain||[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>暂无</li>'}</ul></div>
    <div class="blk"><b>🎯 营销玩法</b><ul>${(c.play||[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>暂无</li>'}</ul></div>
    ${hr}
  </div>`;
  }).join('')||'<div class="empty">暂无竞品数据</div>';
  const cn=(SENTIMENT_DATA.meta&&SENTIMENT_DATA.meta.competitor_brands_cn)||[];
  const badge=cn.join(' / ')||'方里 / 芭贝拉 / 嘉利玛 / 花间颂';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">⚔️</span> 竞品口碑动态</h2><span class="mod-badge">${esc(badge)}</span></div>
   <div class="mod-body">${modNote('范围：竞品（'+esc(badge)+'）口碑与风险，供美诺对标；竞品风险单列「竞品风险（供对标）」块，不进入美诺风险清单；快照为最新监测日口径。')}
   <div class="comp-grid">${cards}</div></div></section>`;
}

function buildList(title,key,arr,main,sub){
  const rows=arr.map(r=>{
    const lv=LEVEL_LABEL[r.sentiment_level]||'中性';
    const lvc=LEVEL_COLOR[r.sentiment_level]||'#7B1FA2';
    return `<div class="list-row"><span class="lv" style="background:${lvc}">${lv}</span><span>${esc(r[main])}</span><span class="meta">平台 ${esc(r.platform||'—')} ｜ 声量 ${esc(r[sub]||'—')}</span>${r.source_url?'<a href="'+esc(r.source_url)+'" target="_blank">🔗</a>':''}</div>`;
  }).join('')||'<div class="empty">暂无热点话题</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🔥</span> ${title}</h2></div><div class="mod-body">${rows}</div></section>`;
}

function buildEndorse(arr){
  const rows=arr.length?arr.map(r=>`<div class="list-row"><span class="lv" style="background:${LEVEL_COLOR[r.sentiment]||'#607D8B'}">${LEVEL_LABEL[r.sentiment]||esc(r.sentiment||'')}</span><span><b>${esc(r.name)}</b> ｜ ${esc(r.note||'')}</span></div>`).join(''):'<div class="empty">暂无代言人舆情监测</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🌟</span> 明星 / 代言人舆情</h2></div><div class="mod-body">${rows}</div></section>`;
}

function buildDropdown(arr){
  const pf=(w)=>Array.isArray(w.platform)?w.platform:[w.platform||'全网搜索'];
  const tags=arr.length?arr.map(w=>`<span class="dw ${w.negative?'neg':'ok'}"><span class="dw-word">${esc(w.word)}</span><span class="dw-pf">${pf(w).map(esc).join(' · ')}</span></span>`).join(''):'<div class="empty">未检出负面联想词</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🔎</span> 搜索下拉词负面联想排查</h2></div>
   <div class="mod-body">${modNote('每词已标注来源平台（如百度搜索/微博热搜联想/抖音搜索下拉/小红书搜索联想/电商搜索下拉），便于定位到对应平台验证与处理；绿色=正向联想词，红色=负面联想词。')}
   <div class="dw-wrap">${tags}</div></div></section>`;
}

function openDrawer(lv){
  const pool=window.__pool||{};
  const items=pool[lv]||[];
  const L=LEVEL_LABEL[lv]||lv, C=LEVEL_COLOR[lv]||'#607D8B';
  document.getElementById('dTitle').innerHTML='<span style="color:'+C+'">●</span> '+L+' 明细（'+items.length+' 条）';
  const html=items.length?items.map(it=>{
    const meta=[];
    if(it.source) meta.push('<span class="tag src">'+esc(it.source)+'</span>');
    if(it.account) meta.push('<span class="meta">@'+esc(it.account)+'</span>');
    if(it.platform) meta.push('<span class="meta">'+esc(it.platform)+'</span>');
    if(it.date) meta.push('<span class="meta">'+esc(it.date)+'</span>');
    if(it.volume) meta.push('<span class="meta">声量 '+esc(it.volume)+'</span>');
    const link=it.url?('<a href="'+esc(it.url)+'" target="_blank">🔗 查看来源</a>'):sourceLink(it);
    return `<div class="drawer-item"><div class="d-meta">${meta.join('')}</div><div class="d-text">${esc(it.text)}</div>${it.direction?'<div class="d-text" style="color:var(--text2);margin-top:4px">'+esc(it.direction)+'</div>':''}${it.disposal?'<div class="risk-disposal"><b>处置：</b>'+esc(it.disposal)+'</div>':''}<div style="margin-top:6px">${link}</div></div>`;
  }).join(''):'<div class="empty">该级别暂无明细条目</div>';
  document.getElementById('dBody').innerHTML=html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('mask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('mask').classList.remove('show');
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function bindTabs(){
  document.querySelectorAll('.tabs .tab').forEach(t=>{
    t.addEventListener('click',()=>{
      const p=t.dataset.p;
      document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.toggle('active',x===t));
      document.querySelectorAll('.ptab-block').forEach(b=>b.classList.toggle('active',b.dataset.p===p));
    });
  });
}
setDate(curDateFromUrl());
</script>
</body>
</html>
