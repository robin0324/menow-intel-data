  });
  const donut=`<div class="donut" style="background:conic-gradient(${segs.join(',')})"></div>`;
  const legend=`<div class="donut-legend">`+[['high_risk','高危'],['light_negative','轻负'],['neutral','中性'],['positive','正面']].map(([k,t])=>`<span><i style="background:${LEVEL_COLOR[k]}"></i>${t} ${dist[k]||0}</span>`).join('')+`</div>`;
  const pmax=Math.max(...pdist.map(p=>p.count),1);
  const pcolors={'电商评价':'#FB8C00','小红书':'#E0245E','抖音':'#333','微博':'#E6162D','快手':'#FF4906'};
  const bars=pdist.map(p=>`<div class="pbar"><span class="pname">${esc(p.platform)}</span><span class="ptrack"><span class="pfill" style="width:${(p.count/pmax*100).toFixed(0)}%;background:${pcolors[p.platform]||'#7B1FA2'}"></span></span><span class="pcnt">${p.count}</span></div>`).join('')||'<div class="empty">暂无</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">📈</span> 声量趋势与分布</h2><span class="mod-badge">仅美诺品牌</span></div>
   <div class="mod-body">${modNote('统计口径：'+esc((D.meta||{}).voice_scope||'仅美诺品牌公开检索条目数')+'；条形按各平台数量占最大平台比例填充（颜色越满=数量越高），数据为公开检索相对估算。')}
   <div class="charts">
     <div class="chart-box"><h4>近 7 日声量趋势</h4>${trendSvg}</div>
     <div class="chart-box"><h4>情感分布</h4>${donut}${legend}</div>
     <div class="chart-box"><h4>平台分布</h4>${bars}</div>
   </div></div></section>`;
}

function buildRisks(risks){
  const sorted=[...risks].sort((a,b)=>((a.level==='high_risk')?-1:1)-((b.level==='high_risk')?-1:1));
  const items=sorted.map(r=>{
    const lvl=r.level||'light_negative';
    const cls=lvl==='high_risk'?'risk-item':'risk-item light';
    return `<div class="${cls}">
      <div class="risk-meta">
        <span class="tag ${lvl}">${LEVEL_LABEL[lvl]||lvl}</span>
        ${r.source?`<span class="tag src">${esc(r.source)}</span>`:''}
        ${r.account?`<span class="meta">@${esc(r.account)}</span>`:''}
        ${r.date?`<span class="meta">${esc(r.date)}</span>`:''}
        ${r.heat?`<span class="tag heat">热度 ${esc(r.heat)}</span>`:''}
      </div>
      <div class="risk-text">${esc(r.text)}</div>
      ${sourceLink(r)}
      ${r.disposal?`<div class="risk-disposal"><b>处置方案：</b>${esc(r.disposal)}</div>`:''}
    </div>`;
  }).join('')||'<div class="empty">近 N 日未检出美诺风险舆情 🎉</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">⚠️</span> 风险舆情清单</h2><span class="mod-badge">仅美诺 · 高危置顶</span></div>
   <div class="mod-body">${modNote('范围：仅美诺 MENOW 品牌相关风险（竞品风险见「竞品口碑动态」）；每条提供来源链接，点击可直达详情页处理。')}
   ${items}</div></section>`;
}

function buildPlatforms(ps){
  const plats=Object.keys(ps);
  if(!plats.length) return `<section class="module"><div class="mod-header"><h2><span class="icon">🗣️</span> 分平台口碑汇总</h2></div><div class="mod-body"><div class="empty">暂无分平台数据</div></div></section>`;
  const tabs=plats.map((p,i)=>`<div class="tab ${i===0?'active':''}" data-p="${esc(p)}">${esc(p)}</div>`).join('');
  const blocks=plats.map((p,i)=>{
    const d=ps[p]||{};
    const ul=(arr,empty)=>((arr&&arr.length)?'<ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="empty">'+empty+'</div>');
    return `<div class="ptab-block ${i===0?'active':''}" data-p="${esc(p)}">
      <h5>👍 核心夸赞卖点</h5>${ul(d.praise,'暂无')}
      <h5>💬 高频用户咨询</h5>${ul(d.consult,'暂无')}
      <h5>🟠 轻度负面</h5>${ul(d.light_negative,'暂无')}
    </div>`;
  }).join('');
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🗣️</span> 分平台口碑汇总</h2><span class="mod-badge">仅美诺品牌</span></div>
   <div class="mod-body">${modNote('范围：仅美诺 MENOW 品牌各平台口碑概览（竞品口碑见「竞品口碑动态」）；内容为公开检索归纳，原生评论区深度内容可能缺失。')}
   <div class="tabs">${tabs}</div>${blocks}</div></section>`;
}

function buildCompetitors(comps){
  const cards=comps.map(c=>{
    const hr=(c.high_risk&&c.high_risk.length)?('<div class="risk-box"><b>⚠️ 竞品风险（供对标）：</b><ul>'+
      c.high_risk.map(r=>'<li>'+esc(r.text)+' '+(r.source_url?'<a href="'+esc(r.source_url)+'" target="_blank">查看来源</a>':'')+'</li>').join('')+'</ul></div>'):'';
    return `<div class="comp-card"><h3>${esc(c.name)}</h3>
    <div class="blk"><b>👍 优点</b><ul>${(c.pros||[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>暂无</li>'}</ul></div>
    <div class="blk"><b>🟠 用户痛点</b><ul>${(c.pain||[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>暂无</li>'}</ul></div>
    <div class="blk"><b>🎯 营销玩法</b><ul>${(c.play||[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>暂无</li>'}</ul></div>
    ${hr}
  </div>`;
  }).join('')||'<div class="empty">暂无竞品数据</div>';
  const badge=(D=>(D.meta&&D.meta.competitor_brands||[]).join(' / '))(SENTIMENT_DATA)||'方里 / 芭贝拉 / 嘉利玛 / 花间颂';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">⚔️</span> 竞品口碑动态</h2><span class="mod-badge">${esc(badge)}</span></div>
   <div class="mod-body">${modNote('范围：竞品（方里/芭贝拉/嘉利玛/花间颂）口碑与风险，供美诺对标；竞品风险单列「竞品风险（供对标）」块，不进入美诺风险清单。')}
   <div class="comp-grid">${cards}</div></div></section>`;
}

function buildList(title,key,arr,main,sub){
  const rows=arr.map(r=>{
    const lv=esc(r.sentiment_level||'neutral');
    return `<div class="list-row"><span class="lv" style="background:${LEVEL_COLOR[r.sentiment_level]||'#7B1FA2'}">${lv}</span><span>${esc(r[main])}</span><span class="meta">平台 ${esc(r.platform||'—')} ｜ 声量 ${esc(r[sub]||'—')}</span>${r.source_url?'<a href="'+esc(r.source_url)+'" target="_blank">🔗</a>':''}</div>`;
  }).join('')||'<div class="empty">暂无热点话题</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🔥</span> ${title}</h2></div><div class="mod-body">${rows}</div></section>`;
}

function buildEndorse(arr){
  const rows=arr.length?arr.map(r=>`<div class="list-row"><span class="lv" style="background:${LEVEL_COLOR[r.sentiment]||'#607D8B'}">${LEVEL_LABEL[r.sentiment]||esc(r.sentiment||'')}</span><span><b>${esc(r.name)}</b> ｜ ${esc(r.note||'')}</span></div>`).join(''):'<div class="empty">暂无代言人舆情监测</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🌟</span> 明星 / 代言人舆情</h2></div><div class="mod-body">${rows}</div></section>`;
}

function buildDropdown(arr){
  const pf=(w)=>Array.isArray(w.platform)?w.platform:[w.platform||'全网搜索'];
  const tags=arr.length?arr.map(w=>`<span class="dw ${w.negative?'neg':'ok'}"><span class="dw-word">${esc(w.word)}</span><span class="dw-pf">${pf(w).map(esc).join(' · ')}</span></span>`).join(''):'<div class="empty">未检出负面联想词</div>';
  return `<section class="module"><div class="mod-header"><h2><span class="icon">🔎</span> 搜索下拉词负面联想排查</h2></div>
   <div class="mod-body">${modNote('每词已标注来源平台（如百度搜索/微博热搜联想/抖音搜索下拉/小红书搜索联想/电商搜索下拉），便于定位到对应平台验证与处理；绿色=正向联想词，红色=负面联想词。')}
   <div class="dw-wrap">${tags}</div></div></section>`;
}

function openDrawer(lv){
  const pool=window.__pool||{};
  const items=pool[lv]||[];
  const L=LEVEL_LABEL[lv]||lv, C=LEVEL_COLOR[lv]||'#607D8B';
  document.getElementById('dTitle').innerHTML='<span style="color:'+C+'">●</span> '+L+' 明细（'+items.length+' 条）';
  const html=items.length?items.map(it=>{
    const meta=[];
    if(it.source) meta.push('<span class="tag src">'+esc(it.source)+'</span>');
    if(it.account) meta.push('<span class="meta">@'+esc(it.account)+'</span>');
    if(it.platform) meta.push('<span class="meta">'+esc(it.platform)+'</span>');
    if(it.date) meta.push('<span class="meta">'+esc(it.date)+'</span>');
    if(it.volume) meta.push('<span class="meta">声量 '+esc(it.volume)+'</span>');
    const link=it.url?('<a href="'+esc(it.url)+'" target="_blank">🔗 查看来源</a>'):sourceLink(it);
    return `<div class="drawer-item"><div class="d-meta">${meta.join('')}</div><div class="d-text">${esc(it.text)}</div>${it.direction?'<div class="d-text" style="color:var(--text2);margin-top:4px">'+esc(it.direction)+'</div>':''}${it.disposal?'<div class="risk-disposal"><b>处置：</b>'+esc(it.disposal)+'</div>':''}<div style="margin-top:6px">${link}</div></div>`;
  }).join(''):'<div class="empty">该级别暂无明细条目</div>';
  document.getElementById('dBody').innerHTML=html;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('mask').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('mask').classList.remove('show');
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function bindTabs(){
  document.querySelectorAll('.tabs .tab').forEach(t=>{
    t.addEventListener('click',()=>{
      const p=t.dataset.p;
      document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.toggle('active',x===t));
      document.querySelectorAll('.ptab-block').forEach(b=>b.classList.toggle('active',b.dataset.p===p));
    });
  });
}
render();
</script>
</body>
</html>
